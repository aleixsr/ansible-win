  documents:
  - id: acrobat-reader
    desc: "Lector de PDF de referència, per als formularis i les signatures que només hi funcionen."
    name: Adobe Acrobat Reader
    winget: Adobe.Acrobat.Reader.64-bit
    choco: adobereader
    mac: adobe-acrobat-reader
  - id: macdown
    desc: "Editor de Markdown de macOS. Aquí el cobreix Mark Text."
    win_equivalent: marktext
    name: MacDown
    mac: macdown
    note: "Espec\xEDfic de macOS. A Windows el cobreix Mark Text, que ja \xE9s en\
      \ aquesta categoria."
  - id: marktext
    desc: "Editor de Markdown amb la previsualització al mateix lloc on escrius."
    name: Mark Text
    choco: marktext
    provider: choco
    mac: mark-text
  - id: modern-csv
    desc: "Obre i edita CSV de milions de línies sense que l'Excel se'ls inventi."
    name: Modern CSV
    winget: PFOJEnterprisesLLC.ModernCSV
    mac: modern-csv
  - id: onlyoffice
    desc: "Suite ofimàtica compatible amb els formats de Microsoft. El substitut de l'Office al catàleg."
    name: ONLYOFFICE Desktop Editors
    winget: ONLYOFFICE.DesktopEditors
    choco: onlyoffice
    mac: onlyoffice
  - id: pdf24
    desc: "Eines de PDF en local: unir, partir, comprimir, convertir i signar."
    name: PDF24 Creator
    winget: geeksoftwareGmbH.PDF24Creator
    choco: pdf24
    mac: revpdf-editor
  - id: xournalpp
    desc: "Anota i omple PDFs a mà, amb tauleta o amb el ratolí."
    name: Xournal++
    winget: Xournal++.Xournal++
    choco: xournalplusplus
    mac: xournal++
  hardware:
  - id: logi-options
    desc: "Configura teclats i ratolins Logitech: botons, gestos i canvi entre equips."
    name: Logi Options+
    winget: Logitech.OptionsPlus
    mac: logi-options+
  store:
  - id: ping-status
    desc: "Latència a la barra de tasques, per veure d'un cop d'ull si la connexió va bé."
    name: PingoMeter
    winget: JustinGrote.PingoMeter
    mac: mas 1158928913 Ping Status
  - id: microsoft-todo
    desc: "Tasques de Microsoft To Do, sincronitzades amb el compte de feina."
    name: Microsoft To Do
    winget: 9NBLGGH5R558
    source: msstore
    mac: mas 1274495053 Microsoft To Do
  - id: mutekey
    desc: "Silencia el micròfon amb una tecla. A Windows, Win+Maj+A de PowerToys."
    win_equivalent: powertoys (Video Conference Mute)
    name: MuteKey
    mac: mas 1509590766 MuteKey
    note: 'Equivalent a Windows: PowerToys Video Conference Mute (Win+Maj+A), ja cobert
      a systemutilities.'
  - id: azure-vpn-client
    desc: "Client oficial per a les VPN Point-to-Site d'Azure."
    name: Azure VPN Client
    winget: 9NP355QT2SQB
    source: msstore
    mac: mas 1553936137 Azure VPN Client
  - id: wireguard
    desc: "Client de WireGuard, per als túnels que no passen per Tailscale."
    name: WireGuard
    winget: WireGuard.WireGuard
    choco: wireguard
    mac: mas 1451685025 WireGuard
  fonts:
  - id: font-meslo
    desc: "Meslo amb les icones de Nerd Fonts. Fa falta perquè el prompt d'Starship es vegi bé."
    name: Meslo LG Nerd Font
    choco: nerd-fonts-meslo
    provider: choco
    mac: font-meslo-lg-nerd-font
startup_disable:
- PDF24
- RustDesk Tray
- Warp
startup_apps:
- name: ShareX
  path: $env:ProgramFiles\ShareX\ShareX.exe
  mac: Shottr
  args:
  - -silent
- name: HWiNFO
  path: $env:ProgramData\chocolatey\lib\hwinfo.install\tools\hwi64.exe
  mac: Stats
- name: PowerToys
  path: $env:LOCALAPPDATA\PowerToys\PowerToys.exe
  mac: MuteKey
  args:
  - --minimized
- name: OneDrive
  path: $env:LOCALAPPDATA\Microsoft\OneDrive\OneDrive.exe
  mac: OneDrive
shell:
  install_profile: true
  prompt: starship
  install_starship_config: true
  configure_terminal: true
  modules:
  - PSReadLine
  - Terminal-Icons
  - posh-git
  - powershell-yaml
tabby:
  install_plugins: true
dev:
  git:
    user_name: ''
    user_email: ''
    default_branch: main
    config:
      init.defaultBranch: main
      pull.rebase: 'true'
      push.autoSetupRemote: 'true'
      core.autocrlf: input
      core.longpaths: 'true'
      core.editor: code --wait
      diff.colorMoved: default
      fetch.prune: 'true'
      rebase.autoStash: 'true'
  ssh:
    generate_key: true
    key_type: ed25519
    comment: ''
  npm_globals: []
  uv_tools: []
  vscode_extensions: []
system:
  explorer:
    hide_desktop_icons: false
    show_file_extensions: true
    show_hidden_files: true
    launch_to_this_pc: true
    show_full_path_in_title: true
    expand_to_open_folder: true
    disable_recent_files: false
  taskbar:
    align_left: true
    hide_search_box: true
    hide_task_view: true
    hide_widgets: true
    hide_chat: true
  appearance:
    dark_mode: true
    transparency: true
    accent_on_taskbar: false
  privacy:
    disable_advertising_id: true
    disable_start_web_search: true
    disable_tailored_experiences: true
  developer:
    enable_developer_mode: true
    enable_long_paths: true
    enable_openssh_server: false
  power:
    # Que fa el portatil en tancar la tapa. Valors de powercfg LIDACTION:
    #   0 = no facis res   1 = suspen   2 = hiberna   3 = apaga
    # Endollat el deixem a 0 per poder treballar amb la tapa tancada sobre una
    # dock USB-C; amb bateria es queda a 1 perque no es cremi a la motxilla.
    lid_action_ac: 0
    lid_action_dc: 1
  input:
    tap_to_click: true
    two_finger_right_click: true
    corner_right_click: false
    tap_and_drag: true
    natural_scrolling: false
    function_keys_standard: true
dotfiles:
  links: []
