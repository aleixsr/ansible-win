meta:
  name: ansible-win
  mirror_of: aleixsr/ansible-mac
provider_order:
- winget
- choco
- scoop
default_roles:
- core
- apps
- shell
- dev
- tabby
- system
- debloat
- startup
- dotfiles
default_groups:
- development
- clouddevops
- networking
- systemutilities
- browsers
- terminal
- communication
- productivity
- networkingvpn
- remoteaccess
- filemanagementcloud
- microsoftsuite
- media
- documents
- hardware
- store
- fonts
sudo:
  provider: gsudo
  powershell_alias: true
  # Posa el directori de gsudo davant de System32 al PATH de maquina, perque
  # el seu sudo.exe guanyi el natiu de Windows 11 a cmd, scripts .bat i tasques
  # programades. Cal executar el run elevat.
  path_priority: true
  # Shim bin\sudo.cmd. Redundant si path_priority funciona: el PATH d'usuari
  # sempre s'avalua despres del de maquina, o sigui que mai guanya System32.
  cmd_shim: false
debloat:
  # Paquets AppX preinstal·lats que volem fora. Es treuen de l'usuari actual i
  # també de la imatge (aprovisionats), que és el que evita que tornin amb cada
  # perfil nou. Posa a false `remove_provisioned` si només vols netejar el teu.
  remove_provisioned: true
  appx:
  # --- publicitat i jocs ------------------------------------------------------
  - id: Microsoft.MicrosoftSolitaireCollection
    desc: "Solitari amb anuncis i compres dins de l'app."
  - id: Microsoft.BingNews
    desc: "Notícies de Bing."
  - id: Microsoft.BingWeather
    desc: "El temps de Bing."
  - id: Microsoft.MicrosoftOfficeHub
    desc: "El llaçador \"Office\": en realitat és publicitat de Microsoft 365."
  - id: Microsoft.Getstarted
    desc: "Suggeriments de Windows."
  # --- coses mortes o retirades per Microsoft ---------------------------------
  - id: Microsoft.MixedReality.Portal
    desc: "Windows Mixed Reality, descontinuat."
  - id: Microsoft.SkypeApp
    desc: "Skype, retirat el maig del 2025."
  - id: Microsoft.549981C3F5F10
    desc: "Cortana."
  - id: Microsoft.People
    desc: "Contactes: app abandonada."
  - id: Microsoft.WindowsMaps
    desc: "Mapes, retirat el 2025."
  - id: Microsoft.Windows.DevHome
    desc: "Dev Home, abandonat per Microsoft el 2025."
  - id: microsoft.windowscommunicationsapps
    desc: "Correu i Calendari, ja retirats en favor del nou Outlook."
  # --- assistents i telemetria ------------------------------------------------
  - id: Microsoft.Copilot
    desc: "Copilot."
  - id: Microsoft.Edge.GameAssist
    desc: "Barra lateral de jocs d'Edge."
  - id: Microsoft.WindowsFeedbackHub
    desc: "Centre de comentaris."
  - id: Microsoft.GetHelp
    desc: "Obtenir ajuda."
  # --- redundants amb el catàleg ----------------------------------------------
  - id: Microsoft.ZuneMusic
    desc: "Reproductor multimèdia. Ja tenim VLC i mpv."
  - id: Microsoft.ZuneVideo
    desc: "Pel·lícules i TV. Ja tenim VLC i mpv."
  # --- Xbox -------------------------------------------------------------------
  # Compte: treure XboxGamingOverlay desactiva Win+G, i amb ell la gravació de
  # pantalla nativa. Al catàleg hi ha ScreenToGif, que fa la mateixa feina.
  - id: Microsoft.XboxGamingOverlay
    desc: "Game Bar (Win+G)."
  - id: Microsoft.XboxGameOverlay
    desc: "Capa de l'Xbox dins dels jocs."
  - id: Microsoft.Xbox.TCUI
    desc: "Interfície compartida de l'Xbox."
  - id: Microsoft.XboxIdentityProvider
    desc: "Inici de sessió amb compte d'Xbox."
  - id: Microsoft.XboxSpeechToTextOverlay
    desc: "Subtítols de veu de l'Xbox."
  # --- Phone Link -------------------------------------------------------------
  - id: Microsoft.YourPhone
    desc: "Phone Link: notificacions i SMS del mòbil al PC."
  - id: MicrosoftWindows.CrossDevice
    desc: "Continuïtat entre dispositius, la meitat de Phone Link."

  # Programes de sempre (no AppX). Es busquen pel nom exacte a Programes i
  # característiques i es desinstal·len en silenci.
  # Programes de sempre (no AppX). Es busquen pel nom EXACTE de Programes i
  # característiques i es desinstal·len en silenci.
  #
  # Aquí hi ha de quedar buit: el bloatware del fabricant canvia amb cada model, i
  # aquest catàleg ha de valer per a qualsevol màquina. El que vulguis treure del
  # teu equip va a config.local.yml, que no es comparteix:
  #
  #   debloat:
  #     win32:
  #     - id: Nom exacte a Programes i característiques
  #       desc: "Què és i per què el treiem."
  #       silent_flag: /S     # només si no porta QuietUninstallString
  win32: []

  # Sense això, Windows torna a instal·lar sol el que acabes d'esborrar.
  settings:
    disable_consumer_features: true   # el que reinstal·la jocs i apps promocionades
    disable_recall: true              # captures contínues de pantalla de Windows AI
    disable_copilot: true
    disable_widgets: true
    hide_start_recommendations: true  # el bloc "Recomanat" del menú Inici
    hide_explorer_ads: true           # "notificacions de proveïdors de sincronització"
