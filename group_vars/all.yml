# -----------------------------------------------------------------------------
#  Rol: dev
# -----------------------------------------------------------------------------
dev:
  git:
    # Deixa user_name/user_email buits per no tocar la config global de git.
    user_name: ""
    user_email: ""
    default_branch: main
    # Configuració que s'aplica sempre (idempotent).
    config:
      init.defaultBranch: main
      pull.rebase: "true"
      push.autoSetupRemote: "true"
      core.autocrlf: input
      core.longpaths: "true"
      core.editor: "code --wait"
      diff.colorMoved: default
      fetch.prune: "true"
      rebase.autoStash: "true"
  ssh:
    # Genera ~/.ssh/id_ed25519 si no existeix.
    generate_key: true
    key_type: ed25519
    comment: ""
  # Paquets globals de Node (npm -g).
  npm_globals: []
  # Eines de Python instal·lades amb `uv tool install`.
  uv_tools: []
  # Extensions de VS Code (id complet publisher.extension).
  vscode_extensions: []

# -----------------------------------------------------------------------------
#  Rol: shell
# -----------------------------------------------------------------------------
shell:
  # Instal·la el perfil de PowerShell de files/profile.ps1.
  install_profile: true
  # Prompt: oh-my-posh | starship | none
  prompt: oh-my-posh
  oh_my_posh_theme: jandedobbeleer
  # Aplica files/windows-terminal.settings.json (fa còpia de seguretat de l'original).
  configure_terminal: true
  # Mòduls de PowerShell per a l'usuari actual.
  modules:
    - PSReadLine
    - Terminal-Icons
    - posh-git
    - powershell-yaml

# -----------------------------------------------------------------------------
#  Rol: system  (equivalent als `defaults write` de macOS)
# -----------------------------------------------------------------------------
system:
  explorer:
    show_file_extensions: true
    show_hidden_files: true
    launch_to_this_pc: true
    show_full_path_in_title: true
    expand_to_open_folder: true
    disable_recent_files: false
  taskbar:
    align_left: true
    hide_search_box: true
    hide_task_view: true
    hide_widgets: true
    hide_chat: true
  appearance:
    dark_mode: true
    transparency: true
    accent_on_taskbar: false
  privacy:
    disable_advertising_id: true
    disable_start_web_search: true
    disable_tailored_experiences: true
  power:
    # 'high' | 'balanced' | 'ultimate' | 'none'
    plan: high
    # Minuts; 0 = mai. -1 = no tocar.
    monitor_timeout_ac: -1
    standby_timeout_ac: 0
  developer:
    enable_developer_mode: true
    enable_long_paths: true
    # Instal·la el servidor OpenSSH de Windows (opcional, requereix admin).
    enable_openssh_server: false

# -----------------------------------------------------------------------------
#  Rol: dotfiles
# -----------------------------------------------------------------------------
#  Cada entrada enllaça (symlink) un fitxer del repo a la seva destinació.
#  El destí admet variables d'entorn amb la sintaxi $env:NOM.
dotfiles:
