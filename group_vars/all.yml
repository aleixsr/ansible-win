---
# =============================================================================
#  ansible_windows - catàleg de provisionament
# =============================================================================
#  Aquest fitxer és l'ÚNICA font de veritat. Tot el que instal·la o configura el
#  repo surt d'aquí. Per personalitzar sense tocar el repo, copia
#  group_vars/local.example.yml a group_vars/local.yml (ignorat per git): els
#  seus valors es fusionen a sobre d'aquests.
#
#  Camps d'un paquet:
#    id        identificador intern (obligatori)
#    name      nom llegible que surt a la sortida
#    winget    id de winget       \
#    choco     id de Chocolatey    >  almenys un
#    scoop     id de Scoop        /
#    provider  força un proveïdor concret (salta provider_order)
#    scope     'user' o 'machine' (només winget)
#    args      arguments extra per al gestor
#    test      comanda que ha d'existir al PATH; si hi és, es dona per instal·lat
#    brew      equivalent a ansible_mac, per mantenir la paritat (documental)
# =============================================================================

meta:
  name: ansible_windows
  mirror_of: ansible_mac

# Ordre de preferència quan un paquet té més d'un proveïdor.
provider_order:
  - winget
  - choco
  - scoop

# Rols que executa `run.ps1` sense arguments, en ordre.
default_roles:
  - core
  - apps
  - dev
  - shell
  - system
  - dotfiles

# Grups de paquets que instal·la el rol `apps` per defecte.
# Els grups que no surtin aquí existeixen però són opcionals:
#   .\run.ps1 -Roles apps -Groups virtualization,gaming
default_groups:
  - core
  - cli
  - dev
  - browsers
  - productivity
  - communication
  - media
  - utilities
  - security
  - remote
  - fonts

# -----------------------------------------------------------------------------
#  Comportament de sudo
# -----------------------------------------------------------------------------
#  Windows 11 porta el seu propi C:\Windows\System32\sudo.exe, que guanya al PATH.
#  provider: gsudo  -> `sudo` apunta a gsudo (àlies al perfil + shim per a cmd)
#  provider: native -> es deixa el sudo de Microsoft i només s'instal·la gsudo
sudo:
  provider: gsudo
  # Crea la funció `sudo` al perfil de PowerShell (recomanat, no toca el sistema).
  powershell_alias: true
  # Crea bin\sudo.cmd al repo i el posa al davant del PATH d'usuari, perquè
  # `sudo` també funcioni des de cmd.exe i des de fora de PowerShell.
  cmd_shim: true
  # Cache de credencials de gsudo en segons (0 = desactivada, demana UAC cada cop).
  cache_seconds: 0

# -----------------------------------------------------------------------------
#  Paquets
# -----------------------------------------------------------------------------
packages:

  # --- base del sistema ------------------------------------------------------
  core:
    - id: gsudo
      name: gsudo
      winget: gerardog.gsudo
      choco: gsudo
      brew: "(built-in sudo)"
      test: gsudo
    - id: powershell
